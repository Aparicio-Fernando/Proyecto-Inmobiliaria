<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/Front/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/Front/js.js"></script>
</head>

<body style="background-color: #e8f5e9;">
    <nav class="navbar navbar-expand-lg" style="background-color: #36a838;">
        <div class="container py-3">
            <a class="navbar-brand text-white fw-bold" href="/Front/Index.html">
                <img src="/Front/Imagenes/logo2.png" alt="Logo" style="height: 60px; width: auto;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" role="button"
                            data-bs-toggle="dropdown">
                            Propiedades
                        </a>
                        <ul class="dropdown-menu custom-dropdown">
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/_ListaPropiedades.html">Ver
                                    propiedades</a></li>
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/NuevaPropiedad.html">Cargar
                                    propiedades</a></li>
                        </ul>
                    </div>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Alquileres</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Contacto</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Sobre nosotros</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="/Front/login.html">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <ul class="nav nav-tabs" id="ventaTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="venta-tab" data-bs-toggle="tab" data-bs-target="#venta"
                    type="button" role="tab">Venta</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="cobro-tab" data-bs-toggle="tab" data-bs-target="#cobro" type="button"
                    role="tab" disabled>Cobro</button>
            </li>
        </ul>

        <form class="tab-content border border-top-0 p-4 bg-light" id="formVenta">
            <!-- TAB: Venta -->
            <div class="tab-pane fade show active" id="venta" role="tabpanel">
                <h5 class="mb-3 border-bottom pb-2">🏡 Datos de la propiedad</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Descripción corta</label>
                        <textarea class="form-control" id="venta_desc" readonly></textarea>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Descripción larga</label>
                        <textarea class="form-control" id="venta_desc_larga" readonly></textarea>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio(U$S)</label>
                        <input type="text" class="form-control" id="venta_precio" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Tipo de propiedad</label>
                        <input type="text" class="form-control" id="venta_tipo" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <input type="text" class="form-control" id="venta_estado" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Metros²</label>
                        <input type="text" class="form-control" id="venta_metros" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ambientes</label>
                        <input type="text" class="form-control" id="venta_ambientes" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Baños</label>
                        <input type="text" class="form-control" id="venta_banios" readonly>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="venta_direccion" readonly>
                    </div>
                </div>

                <h5 class="mt-4 mb-3 border-bottom pb-2">🧑 Cliente</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="cliente_apellido" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="cliente_nombre" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control" id="cliente_dni" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">CUIL</label>
                        <input type="text" class="form-control" id="cliente_cuil" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="cliente_telefono" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="cliente_email" required>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="button" class="btn btn-primary" onclick="validarVenta()">Siguiente</button>
                </div>
            </div>

            <!-- TAB: Cobro -->
            <div class="tab-pane fade" id="cobro" role="tabpanel">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <!-- Checkboxes para seleccionar medios -->
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Medio de cobro</label><br>

                            <div class="d-flex flex-wrap align-items-center gap-3">
                                <!-- Check: Efectivo -->
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="chk_efectivo" value="efectivo">
                                    <label class="form-check-label" for="chk_efectivo">Efectivo</label>
                                </div>

                                <!-- Check: Transferencia -->
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="chk_transferencia"
                                        value="transferencia">
                                    <label class="form-check-label" for="chk_transferencia">Transferencia</label>
                                </div>

                                <!-- Cotización Dólar -->
                                <div class="d-flex align-items-center">
                                    <label for="cotizacion_dolar" class="form-label me-2 mb-0">Cotización Dólar:</label>
                                    <input type="number" class="form-control" id="cotizacion_dolar"
                                        style="width: 120px;">
                                </div>
                            </div>
                        </div>

                        <!-- EFECTIVO -->
                        <div class="row" id="grupo_efectivo" style="display: none;">
                            <div class="col-md-12 mb-2">
                                <label class="form-label fw-bold">💵 Monto en efectivo</label>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Monto en pesos ($)</label>
                                <input type="number" class="form-control" id="efectivo_pesos">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Monto en dólares (U$S)</label>
                                <input type="number" class="form-control" id="efectivo_dolares">
                            </div>
                            <hr>
                        </div>
                        <!-- TRANSFERENCIA -->
                        <div class="row" id="grupo_transferencia" style="display: none;">
                            <div class="col-md-12 mb-2">
                                <label class="form-label fw-bold">🏦 Monto por transferencia</label>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Monto en pesos ($)</label>
                                    <input type="number" class="form-control" id="transferencia_pesos">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Monto en dólares (U$S)</label>
                                    <input type="number" class="form-control" id="transferencia_dolares">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Banco</label>
                                    <input type="text" class="form-control" id="cobro_banco">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Número de comprobante</label>
                                    <input type="text" class="form-control" id="cobro_comprobante">
                                </div>
                            </div>
                            <hr>
                        </div>
                        <div class="row" id="grupo_datos">
                            <div class="col-md-12 mb-2">
                                <label class="form-label fw-bold">🧾 Datos de cobro</label>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha de cobro</label>
                                    <input type="date" class="form-control" id="cobro_fecha" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Valor Inmueble (U$S)</label>
                                    <input type="text" class="form-control" id="valor_casa" readonly>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Valor Inmueble ($)</label>
                                    <input type="text" class="form-control" id="valor_pesos" readonly>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Subtotal ($)</label>
                                    <input type="text" class="form-control" id="cobro_subtotal" readonly>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Comisión (%)</label>
                                    <input type="number" class="form-control" id="cobro_comision" value="0">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">TOTAL A COBRAR ($)</label>
                                    <input type="text" class="form-control" id="cobro_total" readonly>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Observaciones</label>
                                <textarea class="form-control" id="cobro_observaciones" rows="2"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="text-end mt-3">
                        <button type="button" class="btn btn-success" onclick="confirmarVenta()">Confirmar
                            Venta</button>
                    </div>
                </div>
        </form>
    </div>

    <!-- Modal: Venta confirmada -->
    <div class="modal fade" id="modalVentaConfirmada" tabindex="-1" aria-labelledby="modalVentaConfirmadaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalVentaConfirmadaLabel">Venta confirmada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    La operación se registró correctamente.
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-success" onclick="redirigirListado()">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {

            $('#cotizacion_dolar, #efectivo_pesos, #efectivo_dolares, #transferencia_pesos, #transferencia_dolares, #cobro_comision')
                .on('input', recalcularTotales);

            $('#cotizacion_dolar').val('1');
            // Cargar datos si existe propiedad seleccionada
            const id = localStorage.getItem("propiedadParaVenta");
            const propiedades = JSON.parse(localStorage.getItem("propiedadData")) || [];
            const domicilios = JSON.parse(localStorage.getItem("domiciliosPropiedad")) || [];

            const prop = propiedades.find(p => p.IdPropiedad === id);
            const dom = domicilios.find(d => d.IdPropiedad === id);

            if (prop) {
                $('#venta_desc').val(prop.descripcionCorta);
                $('#venta_desc_larga').val(prop.descripcionLarga);
                $('#venta_precio').val('$' + Number(prop.precio).toLocaleString('es-AR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }));
                $('#venta_tipo').val(
                    prop.tipoPropiedad === "1" ? "Casa" :
                        prop.tipoPropiedad === "2" ? "Departamento" :
                            prop.tipoPropiedad === "3" ? "Terreno" : "Otro"
                );
                $('#venta_estado').val(
                    prop.estado === "1" ? "Disponible" :
                        prop.estado === "2" ? "Reservada" :
                            prop.estado === "3" ? "Vendida" : "Otro"
                );
                $('#venta_metros').val(prop.metros);
                $('#venta_ambientes').val(prop.ambientes);
                $('#venta_banios').val(prop.banios);

                $('#valor_casa').val(prop.precio);
                $('#cotizacion_dolar').val('1'); // inicializa
                recalcularTotales();             // calcula Valor Inmueble ($)
            }

            if (dom) {
                const direccion = `${dom.Calle} ${dom.Altura || ''}, ${dom.Barrio || ''}, ${dom.Localidad}, ${dom.Provincia}`;
                $('#venta_direccion').val(direccion);
            }

            $('#formVenta').on('input change', 'input, select', function () {
                if ($(this).val().trim() !== "") {
                    $(this).removeClass('error');
                    $(this).siblings('.invalid-feedback').remove();
                }
            });

            // Ocultar al inicio
            $('#grupo_transferencia').hide();

            // Mostrar si se elige transferencia
            $('#cobro_medio').on('change', function () {
                const medio = $(this).val();
                if (medio === 'transferencia') {
                    $('#grupo_transferencia').show();
                } else {
                    $('#grupo_transferencia').hide();
                    $('#cobro_banco, #cobro_comprobante').val('');
                }
            });

            $('#chk_efectivo').on('change', function () {
                $('#grupo_efectivo').toggle(this.checked);
            });

            $('#chk_transferencia').on('change', function () {
                $('#grupo_transferencia').toggle(this.checked);
            });

            $('#cotizacion_dolar, #efectivo_pesos, #efectivo_dolares, #transferencia_pesos, #transferencia_dolares, #cobro_comision').on('input', recalcularTotales);

            if (prop) {
                $('#valor_casa').val(prop.precio);
                //$('#valor_casa').val(prop.precio);
                $('#venta_precio').val(Number(prop.precio).toLocaleString('es-AR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }));
            }
        });

        function parseARNumber(str) {
            if (typeof str !== 'string') str = String(str);
            str = str.trim().replace(/\./g, '').replace(',', '.');
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function formatARNumber(num) {
            return new Intl.NumberFormat('es-AR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }

        function recalcularTotales() {
            const cotizacion = parseARNumber($('#cotizacion_dolar').val());
            const valorUSD = parseARNumber($('#valor_casa').val());
            const valorPesos = valorUSD * cotizacion;
            $('#valor_pesos').val(formatARNumber(valorPesos));

            const ef_pesos = parseARNumber($('#efectivo_pesos').val());
            const ef_dolares = parseARNumber($('#efectivo_dolares').val());
            const trans_pesos = parseARNumber($('#transferencia_pesos').val());
            const trans_dolares = parseARNumber($('#transferencia_dolares').val());

            const subtotal = ef_pesos + trans_pesos + (ef_dolares + trans_dolares) * cotizacion;
            $('#cobro_subtotal').val(formatARNumber(subtotal));

            const comisionPorcentaje = parseARNumber($('#cobro_comision').val());
            const total = valorPesos + (valorPesos * comisionPorcentaje / 100);
            $('#cobro_total').val(formatARNumber(total));

            // ✅ Validación automática
            if (total === subtotal) {
                $('#cobro_total').removeClass('error');
                $('#cobro_total').siblings('.invalid-feedback').remove();
            }
        }


        function validarVenta() {
            // Limpiar errores anteriores
            $('#venta input').removeClass('error');
            $('#venta .invalid-feedback').remove();

            let valido = true;

            // Validar campos requeridos
            $('#cliente_apellido, #cliente_nombre, #cliente_dni, #cliente_cuil, #cliente_telefono, #cliente_email').each(function () {
                if ($(this).val().trim() === "") {
                    $(this).addClass('error');
                    $(this).after('<div class="invalid-feedback">Campo obligatorio</div>');
                    valido = false;
                }
            });

            if (!valido) return;

            // Habilitar tab Cobro y avanzar
            $('#cobro-tab').removeAttr('disabled');
            const tab = new bootstrap.Tab(document.getElementById('cobro-tab'));
            tab.show();
        }

        // Mostrar/ocultar grupo EFECTIVO
        $('#chk_efectivo').on('change', function () {
            const isChecked = this.checked;
            $('#grupo_efectivo').toggle(isChecked);

            if (!isChecked) {
                // Limpiar valores de efectivo
                $('#efectivo_pesos').val('');
                $('#efectivo_dolares').val('');
            }
            recalcularTotales();
        });

        // Mostrar/ocultar grupo TRANSFERENCIA
        $('#chk_transferencia').on('change', function () {
            const isChecked = this.checked;
            $('#grupo_transferencia').toggle(isChecked);

            if (!isChecked) {
                // Limpiar valores de transferencia
                $('#transferencia_pesos').val('');
                $('#transferencia_dolares').val('');
                $('#cobro_banco').val('');
                $('#cobro_comprobante').val('');
            }
            recalcularTotales();
        });

    </script>
</body>

</html>
