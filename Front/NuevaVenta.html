<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/Front/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/Front/js.js"></script>
</head>

<body style="background-color: #e8f5e9;">
    <nav class="navbar navbar-expand-lg" style="background-color: #36a838;">
        <div class="container py-3">
            <a class="navbar-brand text-white fw-bold" href="/Front/Index.html">
                <img src="/Front/Imagenes/logo2.png" alt="Logo" style="height: 60px; width: auto;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" role="button"
                            data-bs-toggle="dropdown">
                            Propiedades
                        </a>
                        <ul class="dropdown-menu custom-dropdown">
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/_ListaPropiedades.html">Ver
                                    propiedades</a></li>
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/NuevaPropiedad.html">Cargar
                                    propiedades</a></li>
                        </ul>
                    </div>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Alquileres</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Contacto</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Sobre nosotros</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="/Front/login.html">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <ul class="nav nav-tabs" id="ventaTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="venta-tab" data-bs-toggle="tab" data-bs-target="#venta"
                    type="button" role="tab">Venta</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="cobro-tab" data-bs-toggle="tab" data-bs-target="#cobro" type="button"
                    role="tab" disabled>Cobro</button>
            </li>
        </ul>

        <form class="tab-content border border-top-0 p-4 bg-light" id="formVenta">
            <!-- TAB: Venta -->
            <div class="tab-pane fade show active" id="venta" role="tabpanel">
                <h5 class="mb-3 border-bottom pb-2">🏡 Datos de la propiedad</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Descripción corta</label>
                        <textarea class="form-control" id="venta_desc" readonly></textarea>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Descripción larga</label>
                        <textarea class="form-control" id="venta_desc_larga" readonly></textarea>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="text" class="form-control" id="venta_precio" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Tipo de propiedad</label>
                        <input type="text" class="form-control" id="venta_tipo" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <input type="text" class="form-control" id="venta_estado" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Metros²</label>
                        <input type="text" class="form-control" id="venta_metros" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ambientes</label>
                        <input type="text" class="form-control" id="venta_ambientes" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Baños</label>
                        <input type="text" class="form-control" id="venta_banios" readonly>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="venta_direccion" readonly>
                    </div>
                </div>

                <h5 class="mt-4 mb-3 border-bottom pb-2">🧑 Cliente</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="cliente_apellido" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="cliente_nombre" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control" id="cliente_dni" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">CUIL</label>
                        <input type="text" class="form-control" id="cliente_cuil" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="cliente_telefono" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="cliente_email" required>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="button" class="btn btn-primary" onclick="validarVenta()">Siguiente</button>
                </div>
            </div>

            <!-- TAB: Cobro -->
            <div class="tab-pane fade" id="cobro" role="tabpanel">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Medio de cobro</label>
                        <select class="form-select" id="cobro_medio" required>
                            <option value="">Seleccionar</option>
                            <option value="efectivo">Efectivo</option>
                            <option value="transferencia">Transferencia</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha de cobro</label>
                        <input type="date" class="form-control" id="cobro_fecha" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Subtotal ($)</label>
                            <input type="number" class="form-control" id="cobro_subtotal" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Comisión (%)</label>
                            <input type="number" class="form-control" id="cobro_comision" value="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Total a cobrar ($)</label>
                            <input type="number" class="form-control" id="cobro_total" readonly>
                        </div>
                    </div>
                    <div class="row" id="grupo_transferencia">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Banco</label>
                            <input type="text" class="form-control" id="cobro_banco">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Número de comprobante</label>
                            <input type="text" class="form-control" id="cobro_comprobante">
                        </div>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" id="cobro_observaciones" rows="2"></textarea>
                    </div>
                </div>

                <div class="text-end mt-3">
                    <button type="button" class="btn btn-success" onclick="confirmarVenta()">Confirmar Venta</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Modal: Venta confirmada -->
    <div class="modal fade" id="modalVentaConfirmada" tabindex="-1" aria-labelledby="modalVentaConfirmadaLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalVentaConfirmadaLabel">Venta confirmada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    La operación se registró correctamente.
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-success" onclick="redirigirListado()">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            // Cargar datos si existe propiedad seleccionada
            const id = localStorage.getItem("propiedadParaVenta");
            const propiedades = JSON.parse(localStorage.getItem("propiedadData")) || [];
            const domicilios = JSON.parse(localStorage.getItem("domiciliosPropiedad")) || [];

            const prop = propiedades.find(p => p.IdPropiedad === id);
            const dom = domicilios.find(d => d.IdPropiedad === id);

            if (prop) {
                $('#venta_desc').val(prop.descripcionCorta);
                $('#venta_desc_larga').val(prop.descripcionLarga);
                $('#venta_precio').val('$' + Number(prop.precio).toLocaleString());
                $('#venta_tipo').val(
                    prop.tipoPropiedad === "1" ? "Casa" :
                        prop.tipoPropiedad === "2" ? "Departamento" :
                            prop.tipoPropiedad === "3" ? "Terreno" : "Otro"
                );
                $('#venta_estado').val(
                    prop.estado === "1" ? "Disponible" :
                        prop.estado === "2" ? "Reservada" :
                            prop.estado === "3" ? "Vendida" : "Otro"
                );
                $('#venta_metros').val(prop.metros);
                $('#venta_ambientes').val(prop.ambientes);
                $('#venta_banios').val(prop.banios);
                $('#venta_precio').val('$' + Number(prop.precio).toLocaleString());
                $('#cobro_subtotal').val(Number(prop.precio));
                actualizarTotal();
            }

            if (dom) {
                const direccion = `${dom.Calle} ${dom.Altura || ''}, ${dom.Barrio || ''}, ${dom.Localidad}, ${dom.Provincia}`;
                $('#venta_direccion').val(direccion);
            }

            $('#formVenta').on('input change', 'input, select', function () {
                if ($(this).val().trim() !== "") {
                    $(this).removeClass('error');
                    $(this).siblings('.invalid-feedback').remove();
                }
            });

            // Ocultar al inicio
            $('#grupo_transferencia').hide();

            // Mostrar si se elige transferencia
            $('#cobro_medio').on('change', function () {
                const medio = $(this).val();
                if (medio === 'transferencia') {
                    $('#grupo_transferencia').show();
                } else {
                    $('#grupo_transferencia').hide();
                    $('#cobro_banco, #cobro_comprobante').val('');
                }
            });
            // Actualizar total automáticamente
            function actualizarTotal() {
                const subtotal = parseFloat($('#cobro_subtotal').val()) || 0;
                const comision = parseFloat($('#cobro_comision').val()) || 0;
                const total = subtotal + (subtotal * comision / 100);
                $('#cobro_total').val(total.toFixed(2));
            }

            $('#cobro_comision').on('input', actualizarTotal);
        });

        function validarVenta() {
            // Limpiar errores anteriores
            $('#venta input').removeClass('error');
            $('#venta .invalid-feedback').remove();

            let valido = true;

            // Validar campos requeridos
            $('#cliente_apellido, #cliente_nombre, #cliente_dni, #cliente_cuil, #cliente_telefono, #cliente_email').each(function () {
                if ($(this).val().trim() === "") {
                    $(this).addClass('error');
                    $(this).after('<div class="invalid-feedback">Campo obligatorio</div>');
                    valido = false;
                }
            });

            if (!valido) return;

            // Habilitar tab Cobro y avanzar
            $('#cobro-tab').removeAttr('disabled');
            const tab = new bootstrap.Tab(document.getElementById('cobro-tab'));
            tab.show();
        }
        
    </script>
</body>

</html>
