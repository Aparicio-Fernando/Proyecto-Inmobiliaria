    <script>
        document.getElementById('file-browser').addEventListener('click', function () {
            document.getElementById('real-file').click();
        });

        document.getElementById('real-file').addEventListener('change', function () {
            const input = document.getElementById('file-path');
            const files = Array.from(this.files).map(f => f.name).join(', ');
            input.value = files || "Sin archivos seleccionados";
        });

        const defaultImg = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTKyJtLdqtTo_myIf9WB8ea29GhSFugzptRA&s";

        document.getElementById("imageUrlInput").addEventListener("input", function () {
            const url = this.value.trim();
            const preview = document.getElementById("imagePreview");

            if (!url) {
                preview.src = defaultImg;
                return;
            }

            try {
                new URL(url); // Verifica si la URL es válida
                preview.src = url;
            } catch (e) {
                preview.src = defaultImg;
            }
        });
    </script>
