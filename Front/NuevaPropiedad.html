<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/Front/styles.css" rel="stylesheet">
    <script type="text/javascript" src="/Front/js.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #36a838;">
        <div class="container py-3">
            <!-- Logo o nombre del sitio -->
            <a class="navbar-brand text-white fw-bold" href="/Front/Index.html">
                <img src="/Front/Imagenes/logo2.png" alt="Logo" style="height: 60px; width: auto;">
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <!-- Dropdown Ventas -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" id="ventasDropdown"
                            role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Propiedades
                        </a>
                        <ul class="dropdown-menu custom-dropdown" aria-labelledby="ventasDropdown">
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/_ListaPropiedades.html">Ver
                                    propiedades</a></li>
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/NuevaPropiedad.html">Cargar
                                    propiedades</a></li>
                        </ul>
                    </div>

                    <!-- Otros enlaces -->
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Alquileres</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Contacto</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Sobre nosotros</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <ul class="nav nav-tabs" id="formTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="propietario-tab" data-bs-toggle="tab" data-bs-target="#propietario"
                    type="button" role="tab">Propietario</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="propiedad-tab" data-bs-toggle="tab" data-bs-target="#propiedad"
                    type="button" role="tab">Propiedad</button>
            </li>
        </ul>

        <form class="tab-content border border-top-0 p-4 bg-light" id="formulario">
            <!-- Tab Propietario -->
            <div class="tab-pane fade show active" id="propietario" role="tabpanel">
                <div class="mb-3">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="text" class="form-control" id="dni" name="dni" required>
                </div>
                <div class="mb-3">
                    <label for="cuil" class="form-label">CUIL</label>
                    <input type="text" class="form-control" id="cuil" name="cuil" required>
                </div>
                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" required>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
            </div>

            <!-- Tab Propiedad -->
            <div class="tab-pane fade" id="propiedad" role="tabpanel">
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" required>
                </div>
                <div class="mb-3">
                    <label for="habitaciones" class="form-label">Cantidad de habitaciones</label>
                    <input type="number" class="form-control" id="habitaciones" name="habitaciones" required>
                </div>
                <div class="mb-3">
                    <label for="banios" class="form-label">Cantidad de baños</label>
                    <input type="number" class="form-control" id="banios" name="banios" required>
                </div>
                <div class="mb-3">
                    <label for="metros" class="form-label">Metros cuadrados</label>
                    <input type="number" class="form-control" id="metros" name="metros" required>
                </div>
                <div class="mb-3">
                    <label for="provincia" class="form-label">Provincia</label>
                    <input type="text" class="form-control" id="provincia" name="provincia" required>
                </div>
                <div class="mb-3">
                    <label for="localidad" class="form-label">Localidad</label>
                    <input type="text" class="form-control" id="localidad" name="localidad" required>
                </div>
                <div class="mb-3">
                    <label for="barrio" class="form-label">Barrio</label>
                    <input type="text" class="form-control" id="barrio" name="barrio" required>
                </div>
                <div class="mb-3">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" class="form-control" id="precio" name="precio" required>
                </div>
                <div class="mb-3">
                    <label for="urlImagen" class="form-label">URL de imagen</label>
                    <input type="url" class="form-control" id="urlImagen" name="urlImagen" required
                        onchange="mostrarVistaPrevia()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Vista previa</label><br>
                    <img id="vistaPrevia" src="" alt="Vista previa de la imagen" class="img-thumbnail"
                        style="max-width: 300px; display: none;">
                </div>
            </div>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-success" onclick="Guardar()">Guardar</button>
            </div>
        </form>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>

    </script>

</body>

</html>
