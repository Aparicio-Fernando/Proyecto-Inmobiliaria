<body style="background-color: #eef8ef;">
  
   <nav class="navbar navbar-expand-lg" style="background-color: #36a838;">
        <div class="container py-3">
            <!-- Logo o nombre del sitio -->
            <a class="navbar-brand text-white fw-bold" href="#">
                <img src="/Front/Imagenes/logo2.png" alt="Logo" style="height: 60px; width: auto;">
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <!-- Dropdown Ventas -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" id="ventasDropdown"
                            role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Propiedades
                        </a>
                        <ul class="dropdown-menu custom-dropdown" aria-labelledby="ventasDropdown">
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/_ListaPropiedades.html">Ver propiedades</a></li>
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/NuevaPropiedad.html">Cargar propiedades</a></li>
                        </ul>
                    </div>

                    <!-- Otros enlaces -->
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Alquileres</a>

                </div>

        </div>
    </nav>
    <main>


  <!-- Formulario con pestañas -->
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 63vh;">
    <form class="formulario-pequeno tab-content border border-top-0 p-4 bg-light shadow rounded" action="#"
      method="post">
      <h4 class="text-center text-dark"><b>Bienvenido</b></h4><br />
      <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
        <div class="mb-3">
          <label for="Usuario" class="form-label form-label-personalizada"><b>Usuario</b></label>
          <input type="text" placeholder="Usuario" class="form-control form-input" id="Usuario" name="Usuario"
            required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label form-label-personalizada"><b>Password</b></label>
          <input type="password" placeholder="Password" class="form-control form-input" id="password" name="password"
            required />
        </div>

        <div class="mt-4 text-center d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-outline-success px-4">Login</button>
        </div>

        <div class="text-center login-footer mt-4">
          <p>¿Perdiste tu contraseña?</p>
          <p>¿No tienes cuenta?</p>
          <button type="submit" class="btn btn-success px-4">Registrarse</button>

        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
