<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/Front/styles.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #36a838;">
        <div class="container py-3">
            <!-- Logo o nombre del sitio -->
            <a class="navbar-brand text-white fw-bold" href="/Front/Index.html">
                <img src="/Front/Imagenes/logo2.png" alt="Logo" style="height: 60px; width: auto;">
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <!-- Dropdown Ventas -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" id="ventasDropdown"
                            role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Propiedades
                        </a>
                        <ul class="dropdown-menu custom-dropdown" aria-labelledby="ventasDropdown">
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/_ListaPropiedades.html">Ver
                                    propiedades</a></li>
                            <li><a class="dropdown-item custom-dropdown-item" href="/Front/NuevaPropiedad.html">Cargar
                                    propiedades</a></li>
                        </ul>
                    </div>

                    <!-- Otros enlaces -->
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Alquileres</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Contacto</a>
                    <a class="nav-link text-white fw-semibold ms-3" href="#">Sobre nosotros</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div id="contenedor-cards" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </div>

    <!-- Paginación -->
    <nav aria-label="Paginación de propiedades">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link">Anterior</a>
            </li>
            <li class="page-item active">
                <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">3</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">Siguiente</a>
            </li>
        </ul>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function dibujarPropiedades() {
            const contenedor = document.getElementById('contenedor-cards');
            contenedor.innerHTML = ''; // Limpiar

            const propiedades = JSON.parse(localStorage.getItem('propiedadData')) || [];

            propiedades.forEach(p => {
                const card = document.createElement('div');
                card.className = 'col';

                card.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <img src="${p.imagenUrl}" class="card-img-top" alt="Imagen de propiedad" onerror="this.src='https://via.placeholder.com/400x250?text=Sin+imagen'">
                    <div class="card-body">
                        <h5 class="card-title">${p.titulo}</h5>
                        <p class="card-text">
                            <strong>Habitaciones:</strong> ${p.habitaciones}<br>
                            <strong>Baños:</strong> ${p.banios}<br>
                            <strong>Metros²:</strong> ${p.metros}<br>
                            <strong>Precio:</strong> $${Number(p.precio).toLocaleString()}
                        </p>
                    </div>
                </div>
            `;
                contenedor.appendChild(card);
            });
        }

        // Llamamos la función automáticamente cuando se carga la página
        document.addEventListener('DOMContentLoaded', dibujarPropiedades);
    </script>
</body>

</html>
